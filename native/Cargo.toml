[package]
name = "rigo-native"
version = "0.1.0"
edition = "2021"
description = "Native Rust prototype of the Rigo Markdown editor (no browser)"
license = "MIT"

[dependencies]
eframe = "0.32"
egui = "0.32"
pulldown-cmark = "0.13"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
sha2 = "0.10"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
